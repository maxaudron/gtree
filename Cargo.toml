[package]
name = "gtree"
description = "A tool to clone and pull whole group trees from a git forge, properly organized on disk."
version = "1.0.0"
edition = "2021"
authors = ["Max Audron <audron@cocaine.farm>"]
license = "ISC"
homepage = "https://gitlab.com/cocainefarm/gtree"
repository = "https://gitlab.com/cocainefarm/gtree"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
futures = "0.3"

itertools = "0.10"
num_cpus = "1"
once_cell = "1"

gitlab = "0.1501"
graphql_client = "0.10"

git2 = { version = "0.14" }

walkdir = "2"

async-trait = "0.1"

# Arg parsing and config
clap = { version = "3", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = "1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-flame = "0.2"

# error handling
anyhow = "1"
thiserror = "1"

derivative = "2"

url = { version = "2", features = ["serde"] }
xdg = "2"

# terminal coloring
ansi_term = "0.12"

[features]
default = []

vendored-openssl = [ "git2/vendored-openssl" ]
vendored-libgit2 = [ "git2/vendored-libgit2" ]
