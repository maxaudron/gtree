query Projects($scope: String!, $after: String!) {
  projects(membership: true, searchNamespaces: true, search: $scope, after: $after) {
    nodes {
      id
      name
      fullPath
      sshUrlToRepo
      httpUrlToRepo
      repository {
        rootRef
      }
    }

    pageInfo {
      endCursor
      hasNextPage
    }
  }
}
